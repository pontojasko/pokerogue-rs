[package]
name = "pokerogue-client"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "pokerogue-client"

[[bin]]
name = "pokerogue-web"
path = "src/web.rs"
required-features = []

[dependencies]
pokerogue-core = { path = "../pokerogue-core" }
pokerogue-data = { path = "../pokerogue-data" }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
macroquad = "0.4"
