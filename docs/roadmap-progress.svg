<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Progresso do port PokéRogue Rust</title>
<desc id="desc">113 de 126 itens do roadmap concluídos, 13 restantes; 9 cenários visuais automatizados declarados.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
  <linearGradient id="fill" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="shadow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="960" height="280" rx="24" fill="url(#bg)"/>
<circle cx="895" cy="42" r="120" fill="#22d3ee" opacity=".06"/>
<text x="40" y="48" fill="#a5f3fc" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">POKEROGUE-RS · PROGRESSO</text>
<text x="40" y="108" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="750">89.7%</text>
<text x="174" y="105" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="20">do checklist do roadmap concluído</text>
<rect x="40" y="137" width="880" height="20" rx="10" fill="#334155"/>
<rect x="40" y="137" width="789.2" height="20" rx="10" fill="url(#fill)" filter="url(#shadow)" opacity=".55"/>
<rect x="40" y="137" width="789.2" height="20" rx="10" fill="url(#fill)"/>
<text x="40" y="193" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">113 concluídos</text>
<text x="880" y="193" text-anchor="end" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">13 em aberto · 126 itens</text>
<rect x="40" y="218" width="880" height="1" fill="#475569"/>
<text x="40" y="250" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">9 cenários visuais declarados</text>
<text x="920" y="250" text-anchor="end" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12">Checklist com pesos iguais; não representa % do jogo portado ou paridade completa.</text>
</svg>
